name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  host:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r backend/requirements-windows.lock.txt -r config/tailnet-requirements.txt cryptography==46.0.7
      - run: python tools/release_guard.py
      - run: python -m unittest discover -s tests -v
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install platformio==6.1.18
      - run: python tools/check_timed_audio.py
      - run: pio run -e round_voice
  pi-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r config/host-linux.lock.txt
      - run: python -m pip install --require-hashes --only-binary=:all: -r config/group-music-host.lock.txt
      - run: python -m unittest tests.test_round_group_music tests.test_round_sendspin tests.test_timed_speaker tests.test_group_music tests.test_music_library
      - run: python -m unittest tests.test_pi_display_bundle tests.test_pi_echo_audio tests.test_pi_listener tests.test_pi_spotify tests.test_display_alerts tests.test_container_supervisor tests.test_linux_storage tests.test_host_packaging tests.test_recovery_archive tests.test_calendar_drafts tests.test_daily_calendar
      - run: python tools/check_pi_listener_pipeline.py
      - run: python tools/check_pi_music_pipeline.py
