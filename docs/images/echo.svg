<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">Echo Assistant</title><desc id="desc">A round blue assistant display with a glowing ring and three status dots.</desc>
<defs><radialGradient id="bg"><stop stop-color="#07142a"/><stop offset="1" stop-color="#153f68"/></radialGradient><linearGradient id="ring" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#6ea8ff"/><stop offset=".65" stop-color="#adf6e5"/><stop offset="1" stop-color="#ffd5a5"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="12"/></filter></defs>
<rect width="1200" height="520" rx="28" fill="#060e1b"/>
<circle cx="305" cy="260" r="218" fill="url(#bg)" stroke="#244c6b" stroke-width="2"/>
<circle cx="305" cy="250" r="132" fill="none" stroke="url(#ring)" stroke-width="21" opacity=".45" filter="url(#glow)"/>
<circle cx="305" cy="250" r="132" fill="none" stroke="url(#ring)" stroke-width="10"/>
<g fill="#e8f4ff" font-family="system-ui,sans-serif" text-anchor="middle"><text x="305" y="93" font-size="13" letter-spacing="5">ECHO</text><text x="305" y="248" font-size="30">I'm listening.</text><text x="305" y="278" font-size="13" fill="#a8c2db">What's on your mind?</text></g>
<g fill="#93cddc"><circle cx="282" cy="430" r="3"/><circle cx="305" cy="430" r="3"/><circle cx="328" cy="430" r="3"/></g>
<g font-family="system-ui,sans-serif"><text x="605" y="193" fill="#9fdfd9" font-size="15" letter-spacing="4">YOUR HOME. YOUR ASSISTANT.</text><text x="605" y="268" fill="#f1f6ff" font-size="57" font-weight="600">Hello, Echo.</text><text x="608" y="320" fill="#a7b9cf" font-size="21">A little presence. A lot of possibility.</text><text x="608" y="384" fill="#7192b5" font-size="15">ESP32-S3 · AMOLED · Local speech · Home Assistant</text></g></svg>
